<!-- ════════════════════════════════════════════════════════════════
     Fierce Leadership Lab — paste into WPCode as a "HTML Snippet",
     location = Site Wide Footer (or page-specific footer), set to load
     ONLY on the Leadership Lab page. Generated by build-wp-embed.py.
     ════════════════════════════════════════════════════════════════ -->
<script>
// Navigation scroll effect
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('scrolled', window.scrollY > 10);
        });

        // Smooth scroll for anchor links (better iframe compatibility)
        function smoothScrollTo(targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;
            const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - 80;
            window.scrollTo({ top: targetPosition, behavior: 'smooth' });
        }

        document.querySelectorAll('a[href^="#"]').forEach(link => {
            link.addEventListener('click', (e) => {
                const id = link.getAttribute('href').slice(1);
                if (!id) return;
                const target = document.getElementById(id);
                if (!target) return;
                e.preventDefault();
                e.stopPropagation();
                smoothScrollTo(id);
            });
        });

        // Registration modal — opened by every "Reserve" button (.js-reserve)
        const registerModal = document.getElementById('registerModal');
        const modalClose = document.getElementById('modalClose');

        function openModal() {
            registerModal.classList.add('open');
            registerModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('no-scroll');
        }

        function closeModal() {
            registerModal.classList.remove('open');
            registerModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('no-scroll');
        }

        document.querySelectorAll('.js-reserve').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const session = btn.getAttribute('data-session');
                if (session) selectSession(session);
                openModal();
            });
        });

        modalClose.addEventListener('click', closeModal);
        registerModal.addEventListener('click', (e) => {
            if (e.target === registerModal) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && registerModal.classList.contains('open')) closeModal();
        });

        // ─────────────────────────────────────────────────────────────
        // HubSpot Forms API configuration
        // TODO (admins): set HUBSPOT_FORM_ID to the live Leadership Lab form GUID.
        // While it's left as 'PLACEHOLDER_FORM_ID', the form runs in demo mode
        // (no network call) and just shows the confirmation. Portal ID is the
        // existing Fierce HubSpot portal, same as the Learning Series page.
        // ─────────────────────────────────────────────────────────────
        const HUBSPOT_PORTAL_ID = '21395487';
        const HUBSPOT_FORM_ID = '29124d77-ec31-450d-9801-b992f9cf5768';

        // ─────────────────────────────────────────────────────────────
        // HubSpot Payment Links
        // After registration is recorded, the registrant is sent straight to
        // the matching HubSpot-hosted checkout to pay. Create two payment links
        // in HubSpot (Commerce → Payment links) and paste their URLs below:
        //   • SINGLE  → the $299 single-Lab link (used for any one month)
        //   • SERIES  → the $1,799 full-series link
        // While either is left as its PLACEHOLDER, that path falls back to the
        // old flow (show confirmation; admin team bills manually).
        // ─────────────────────────────────────────────────────────────
        const HUBSPOT_PAY_SINGLE = 'https://mail.fierceinc.com/hs/payments/purchase/hscs_642HtjRlcAqppXKxoqgsCsENlv89OHLdFlS6Bs3E4rcrcqrQDfJVZZaLDv7nuzSF?referrer=PAYMENT_LINK';
        const HUBSPOT_PAY_SERIES = 'https://mail.fierceinc.com/hs/payments/purchase/hscs_GrilsBHgN9hPyPCajI3xDSTWcLveJPEmGH0I26ijsntqIlXqccz7XhqdRSVFxbiw?referrer=PAYMENT_LINK';

        // Series -> the flat $1,799 link. Any individual Lab(s) -> the $299
        // link (quantity = number of Labs, set by the buyer at checkout).
        function getPaymentUrl() {
            const url = selectedSessions.includes('series') ? HUBSPOT_PAY_SERIES : HUBSPOT_PAY_SINGLE;
            return url.startsWith('PLACEHOLDER') ? null : url;
        }

        // Lab sessions (2026). Add per-session formId here later if you split
        // registration into one HubSpot form per month.
        const SESSIONS = {
            series:    { date: 'Full 2026 Series (all 7 Labs)', time: '11:00 AM CST', topic: 'Full Series Pass', model: 'Full Series' },
            june:      { date: 'June 17, 2026',      time: '11:00 AM CST', topic: 'Feedback That Builds Trust Instead of Resistance',                                  model: 'Fierce Feedback' },
            july:      { date: 'July 22, 2026',      time: '11:00 AM CST', topic: 'Accountability Without Micromanagement',                                            model: 'Fierce Accountability' },
            august:    { date: 'August 19, 2026',    time: '11:00 AM CST', topic: 'Leading Change Through Conversations',                                              model: 'Fierce Change' },
            september: { date: 'September 16, 2026', time: '11:00 AM CST', topic: 'The Overloaded Leader: Delegating for Growth and Capacity',                         model: 'Fierce Delegate' },
            october:   { date: 'October 14, 2026',   time: '11:00 AM CST', topic: 'The Feedback Gap: Why High-Performing Teams Still Avoid Hard Conversations',        model: 'Fierce Confront' },
            november:  { date: 'November 18, 2026',  time: '11:00 AM CST', topic: 'Leading Teams Through Performance Pressure: Breaking Decision Gridlock and Driving Results', model: 'Fierce Team' },
            december:  { date: 'December 16, 2026',  time: '11:00 AM CST', topic: 'The Leadership Conversations That Define Culture',                                   model: 'Fierce Foundations' },
        };

        const SINGLE_PRICE = 299;
        const SERIES_PRICE = 1799;

        // Currently selected Lab keys. The full series is mutually exclusive
        // with individual Labs (it already includes all seven).
        let selectedSessions = ['june'];

        // Pricing for the current selection.
        function getPricing() {
            const isSeries = selectedSessions.includes('series');
            const count = isSeries ? 1 : selectedSessions.length;
            const total = isSeries ? SERIES_PRICE : selectedSessions.length * SINGLE_PRICE;
            return { isSeries, count, total };
        }

        // Reflect selectedSessions into the cards, hidden input, and summary.
        function renderSelection() {
            document.querySelectorAll('.session-card').forEach(card => {
                const key = card.getAttribute('data-session');
                card.classList.toggle('selected', selectedSessions.includes(key));
            });
            document.getElementById('sessionInput').value = selectedSessions.join(',');
            updateSummary();
        }

        function updateSummary() {
            const label = document.getElementById('selectionSummaryLabel');
            const totalEl = document.getElementById('selectionSummaryTotal');
            let note = document.getElementById('selectionSummaryNote');

            if (selectedSessions.length === 0) {
                label.textContent = 'No Lab selected yet';
                totalEl.textContent = '$0';
                if (note) note.remove();
                return;
            }

            const { isSeries, total } = getPricing();
            if (isSeries) {
                label.textContent = 'Full Series Pass (all 7 Labs)';
            } else {
                const n = selectedSessions.length;
                label.textContent = `${n} Lab${n > 1 ? 's' : ''} selected`;
            }
            totalEl.textContent = '$' + total.toLocaleString();

            // When more than one individual Lab is chosen, the HubSpot checkout
            // needs the buyer to confirm quantity. Tell them exactly what to set.
            const n = selectedSessions.length;
            if (!isSeries && n > 1) {
                if (!note) {
                    note = document.createElement('span');
                    note.id = 'selectionSummaryNote';
                    note.className = 'selection-summary-note';
                    document.getElementById('selectionSummary').appendChild(note);
                }
                note.textContent = `At checkout, set quantity to ${n} to cover all ${n} Labs.`;
            } else if (note) {
                note.remove();
            }
        }

        // Card click: toggle a Lab on/off (series clears individuals & vice versa).
        function toggleSession(key) {
            if (key === 'series') {
                selectedSessions = selectedSessions.includes('series') ? [] : ['series'];
            } else {
                selectedSessions = selectedSessions.filter(k => k !== 'series');
                if (selectedSessions.includes(key)) {
                    selectedSessions = selectedSessions.filter(k => k !== key);
                } else {
                    selectedSessions.push(key);
                }
            }
            renderSelection();
        }

        // Preselect exactly one Lab (used by the page's "Reserve" buttons).
        function selectSession(key) {
            selectedSessions = [key];
            renderSelection();
        }

        // After a registration is recorded, send the registrant to the matching
        // HubSpot checkout. If no live payment link is configured for this
        // selection, fall back to the confirmation card (manual billing).
        function finishRegistration() {
            const payUrl = getPaymentUrl();
            if (payUrl) { window.location.href = payUrl; return; }
            showConfirmation();
        }

        // Initialise the summary on load.
        renderSelection();

        // Form validation and submission
        const form = document.getElementById('rsvpForm');
        const formContainer = document.getElementById('formContainer');
        const confirmation = document.getElementById('confirmation');

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validateField(input) {
            const formGroup = input.closest('.form-group');
            let isValid = true;
            if (input.required) {
                isValid = input.type === 'email' ? validateEmail(input.value) : input.value.trim() !== '';
            }
            formGroup.classList.toggle('has-error', !isValid);
            input.classList.toggle('error', !isValid);
            return isValid;
        }

        const inputs = form.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('blur', () => {
                if (input.value.trim() !== '' || input.required) validateField(input);
            });
            input.addEventListener('input', () => {
                if (input.classList.contains('error')) validateField(input);
            });
        });

        function getHubSpotCookie() {
            const value = `; ${document.cookie}`;
            const parts = value.split('; hubspotutk=');
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function getUtmParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']
                .map(key => ({ key, value: urlParams.get(key) }))
                .filter(p => p.value)
                .map(p => ({ name: p.key, value: p.value }));
        }

        function showConfirmation() {
            formContainer.classList.add('hidden');
            confirmation.classList.add('show');
            registerModal.scrollTop = 0;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            let isFormValid = true;
            form.querySelectorAll('.form-input[required]').forEach(input => {
                if (!validateField(input)) isFormValid = false;
            });
            if (!isFormValid) return;

            if (selectedSessions.length === 0) {
                showFormError('Please choose at least one Lab.');
                return;
            }

            const submitBtn = form.querySelector('.btn-submit');
            const originalBtnText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Pack the (possibly multiple) selected Labs into two fields:
            //   session_topic -> the chosen Labs + count and total (the field
            //                    that tells you WHAT they selected)
            //   session_time  -> the Lab time (same for every Lab)
            const picked = selectedSessions.map(k => SESSIONS[k]);
            const { count, total } = getPricing();
            const sessionSummary = {
                time:  picked[0].time,
                topic: picked.map(s => s.topic).join(' | ') + `  (${count} ×, $${total.toLocaleString()})`
            };

            // Demo mode: until a real HubSpot form ID is set, skip the network
            // call and just confirm. Admins flip HUBSPOT_FORM_ID to go live.
            if (HUBSPOT_FORM_ID === 'PLACEHOLDER_FORM_ID') {
                setTimeout(finishRegistration, 400);
                return;
            }

            let pageUri;
            try { pageUri = window.top.location.href; } catch (e) { pageUri = window.location.href; }
            const hutk = getHubSpotCookie();

            const formData = {
                fields: [
                    { name: 'firstname', value: document.getElementById('firstName').value.trim() },
                    { name: 'lastname', value: document.getElementById('lastName').value.trim() },
                    { name: 'email', value: document.getElementById('email').value.trim() },
                    { name: 'company', value: document.getElementById('company').value.trim() },
                    { name: 'jobtitle', value: document.getElementById('title').value.trim() },
                    { name: 'session_topic', value: sessionSummary.topic },
                    { name: 'session_time', value: sessionSummary.time },
                    ...getUtmParams()
                ],
                context: {
                    ...(hutk && { hutk }),
                    pageUri,
                    pageName: 'Fierce Leadership Lab Registration'
                },
                skipValidation: true
            };

            try {
                const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_ID}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    finishRegistration();
                } else {
                    const responseText = await response.text();
                    console.error('HubSpot submission error:', response.status, responseText);
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    showFormError('Something went wrong. Please try again.');
                }
            } catch (error) {
                console.error('Network error:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                showFormError('Network error. Please check your connection and try again.');
            }
        });

        function showFormError(message) {
            let errorDiv = form.querySelector('.form-error-message');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.className = 'form-error-message';
                errorDiv.style.cssText = 'color: var(--color-error); text-align: center; margin-top: 16px; font-size: 14px;';
                form.appendChild(errorDiv);
            }
            errorDiv.textContent = message;
        }
</script>
