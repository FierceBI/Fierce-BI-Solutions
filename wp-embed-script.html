<!-- ════════════════════════════════════════════════════════════════
     Fierce Leadership Lab — paste into WPCode as a "HTML Snippet",
     location = Site Wide Footer (or page-specific footer), set to load
     ONLY on the Leadership Lab page. Generated by build-wp-embed.py.
     ════════════════════════════════════════════════════════════════ -->
<script>
// Fierce Leadership Lab — guide page. Two CTAs: "Enroll in a Session"
    // (individual) and "Full Series Pass". Self-contained, run-once, DOM-ready.
    (function () {
        if (window.__fierceLabInit) return;
        window.__fierceLabInit = true;

        // TEST vs LIVE is controlled by the iframe URL — no code change needed.
        //   TEST  (default): buttons go to the $1 preview checkouts.
        //   LIVE:  add "live=1" to the iframe src (e.g. ...?v=9&live=1) → real links.
        const TEST_MODE = !window.location.search.includes('live=1');
        // Individual test: all sessions as OPTIONAL line items (preview page).
        const PAY_TEST_INDIVIDUAL = 'https://mail.fierceinc.com/hs/payments/9pgbxyqjSW?referrer=PAYMENT_LINK';
        // Series test: a single line item.
        const PAY_TEST_SERIES = 'https://mail.fierceinc.com/hs/payments/2f6RMSVV?referrer=PAYMENT_LINK';

        // Individual Sessions: one HubSpot link with every session as an OPTIONAL,
        // editable-quantity line item (buyer picks sessions + # of people at checkout).
        const PAY_INDIVIDUAL = 'https://mail.fierceinc.com/hs/payments/SPPqsxVVND2ShGD?referrer=PAYMENT_LINK';
        // Full Series Pass ($1,799 per seat, editable quantity for multiple people).
        const PAY_SERIES = 'https://mail.fierceinc.com/hs/payments/hFNnFvfKMFnnz2?referrer=PAYMENT_LINK';

        function setLinks(selector, url) {
            if (!url || url.startsWith('PLACEHOLDER')) return;
            document.querySelectorAll(selector).forEach(function (a) { a.href = url; });
        }

        function init() {
            setLinks('.js-individual', TEST_MODE ? PAY_TEST_INDIVIDUAL : PAY_INDIVIDUAL);
            setLinks('.js-series',     TEST_MODE ? PAY_TEST_SERIES : PAY_SERIES);

            var nav = document.getElementById('nav');
            if (nav) {
                window.addEventListener('scroll', function () {
                    nav.classList.toggle('scrolled', window.scrollY > 10);
                });
            }

            document.querySelectorAll('a[href^="#"]').forEach(function (link) {
                link.addEventListener('click', function (e) {
                    var id = link.getAttribute('href').slice(1);
                    var target = id && document.getElementById(id);
                    if (!target) return;
                    e.preventDefault();
                    var top = target.getBoundingClientRect().top + window.pageYOffset - 80;
                    window.scrollTo({ top: top, behavior: 'smooth' });
                });
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
