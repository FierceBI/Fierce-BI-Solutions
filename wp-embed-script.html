<!-- ════════════════════════════════════════════════════════════════
     Fierce Leadership Lab — paste into WPCode as a "HTML Snippet",
     location = Site Wide Footer (or page-specific footer), set to load
     ONLY on the Leadership Lab page. Generated by build-wp-embed.py.
     ════════════════════════════════════════════════════════════════ -->
<script>
// Self-contained, run-once, DOM-ready. Safe in <head> or footer, and
    // immune to WordPress/Divi load order or being included twice.
    (function () {
        if (window.__fierceLabInit) return;   // guard against double-inclusion
        window.__fierceLabInit = true;

        // ── HubSpot Forms API ──
        // Set HUBSPOT_FORM_ID to the live Leadership Lab form GUID. While it is
        // 'PLACEHOLDER_FORM_ID' the form runs in demo mode (no network call).
        const HUBSPOT_PORTAL_ID = '21395487';
        const HUBSPOT_FORM_ID = '29124d77-ec31-450d-9801-b992f9cf5768';

        // ── HubSpot Payment Links ──
        // After registration, the registrant is sent straight to the checkout
        // whose total already matches their selection — no quantity step.
        //   1–5 individual Labs -> the matching quantity link below
        //   6+ individual Labs OR "Full Series" -> the $1,799 series link
        //     (6+ rolls up to the all-7 series since it's the better value)
        const HUBSPOT_PAY_SERIES = 'https://mail.fierceinc.com/hs/payments/hFNnFvfKMFnnz2?referrer=PAYMENT_LINK';
        const HUBSPOT_PAY_BY_QTY = {
            1: 'https://mail.fierceinc.com/hs/payments/SPPqsxVVND2ShGD?referrer=PAYMENT_LINK',
            2: 'https://mail.fierceinc.com/hs/payments/ZrnCKgYbVssb7nh?referrer=PAYMENT_LINK',
            3: 'https://mail.fierceinc.com/hs/payments/9Tyk6TYKDghz?referrer=PAYMENT_LINK',
            4: 'https://mail.fierceinc.com/hs/payments/NFnzxRsxkWt7DK?referrer=PAYMENT_LINK',
            5: 'https://mail.fierceinc.com/hs/payments/cTyJPTxkPPjm?referrer=PAYMENT_LINK',
        };

        const SESSIONS = {
            series:    { date: 'Full 2026 Series (all 7 Labs)', time: '11:00 AM CST', topic: 'Full Series Pass', model: 'Full Series' },
            june:      { date: 'June 17, 2026',      time: '11:00 AM CST', topic: 'Feedback That Builds Trust Instead of Resistance',                                  model: 'Fierce Feedback' },
            july:      { date: 'July 22, 2026',      time: '11:00 AM CST', topic: 'Accountability Without Micromanagement',                                            model: 'Fierce Accountability' },
            august:    { date: 'August 19, 2026',    time: '11:00 AM CST', topic: 'Leading Change Through Conversations',                                              model: 'Fierce Change' },
            september: { date: 'September 16, 2026', time: '11:00 AM CST', topic: 'The Overloaded Leader: Delegating for Growth and Capacity',                         model: 'Fierce Delegate' },
            october:   { date: 'October 14, 2026',   time: '11:00 AM CST', topic: 'The Feedback Gap: Why High-Performing Teams Still Avoid Hard Conversations',        model: 'Fierce Confront' },
            november:  { date: 'November 18, 2026',  time: '11:00 AM CST', topic: 'Leading Teams Through Performance Pressure: Breaking Decision Gridlock and Driving Results', model: 'Fierce Team' },
            december:  { date: 'December 16, 2026',  time: '11:00 AM CST', topic: 'The Leadership Conversations That Define Culture',                                   model: 'Fierce Foundations' },
        };

        const SINGLE_PRICE = 299;
        const SERIES_PRICE = 1799;

        // Currently selected Lab keys. Series is mutually exclusive with Labs.
        let selectedSessions = ['june'];

        // DOM refs (assigned in init()).
        let nav, registerModal, modalClose, form, formContainer, confirmation;

        // Pricing for the current selection. 6+ individual Labs roll up to the
        // Full Series (better value), so they bill the series price.
        function getPricing() {
            const count = selectedSessions.length;
            const explicitSeries = selectedSessions.includes('series');
            const useSeries = explicitSeries || count >= 6;
            return {
                count,
                explicitSeries,
                useSeries,
                upgraded: useSeries && !explicitSeries,
                total: useSeries ? SERIES_PRICE : count * SINGLE_PRICE
            };
        }

        // Route to the checkout whose total already matches the selection.
        function getPaymentUrl() {
            const { useSeries, count } = getPricing();
            const url = useSeries ? HUBSPOT_PAY_SERIES : HUBSPOT_PAY_BY_QTY[count];
            return (url && !url.startsWith('PLACEHOLDER')) ? url : null;
        }

        function renderSelection() {
            document.querySelectorAll('.session-card').forEach(card => {
                const key = card.getAttribute('data-session');
                card.classList.toggle('selected', selectedSessions.includes(key));
            });
            const hidden = document.getElementById('sessionInput');
            if (hidden) hidden.value = selectedSessions.join(',');
            updateSummary();
        }

        function updateSummary() {
            const label = document.getElementById('selectionSummaryLabel');
            const totalEl = document.getElementById('selectionSummaryTotal');
            let note = document.getElementById('selectionSummaryNote');
            if (!label || !totalEl) return;

            if (selectedSessions.length === 0) {
                label.textContent = 'No Lab selected yet';
                totalEl.textContent = '$0';
                if (note) note.remove();
                return;
            }

            const { count, explicitSeries, upgraded, total } = getPricing();
            if (explicitSeries) {
                label.textContent = 'Full Series Pass (all 7 Labs)';
            } else if (upgraded) {
                label.textContent = `${count} Labs → Full Series (all 7)`;
            } else {
                label.textContent = `${count} Lab${count > 1 ? 's' : ''} selected`;
            }
            totalEl.textContent = '$' + total.toLocaleString();

            // Only message left: 6+ individual Labs become the Full Series.
            const summaryEl = document.getElementById('selectionSummary');
            if (upgraded && summaryEl) {
                if (!note) {
                    note = document.createElement('span');
                    note.id = 'selectionSummaryNote';
                    note.className = 'selection-summary-note';
                    summaryEl.appendChild(note);
                }
                note.textContent = `6+ Labs selected — you'll get the Full Series Pass (all 7) for $1,799, our best value.`;
            } else if (note) {
                note.remove();
            }
        }

        // Toggle a Lab on/off (series clears individuals & vice versa).
        function toggleSession(key) {
            if (key === 'series') {
                selectedSessions = selectedSessions.includes('series') ? [] : ['series'];
            } else {
                selectedSessions = selectedSessions.filter(k => k !== 'series');
                if (selectedSessions.includes(key)) {
                    selectedSessions = selectedSessions.filter(k => k !== key);
                } else {
                    selectedSessions.push(key);
                }
            }
            renderSelection();
        }

        // Preselect exactly one Lab (used by the page's "Reserve" buttons).
        function selectSession(key) {
            selectedSessions = [key];
            renderSelection();
        }

        // Expose for the inline onclick handlers in the markup.
        window.toggleSession = toggleSession;
        window.selectSession = selectSession;

        function openModal() {
            if (!registerModal) return;
            registerModal.classList.add('open');
            registerModal.setAttribute('aria-hidden', 'false');
            document.body.classList.add('no-scroll');
        }

        function closeModal() {
            if (!registerModal) return;
            registerModal.classList.remove('open');
            registerModal.setAttribute('aria-hidden', 'true');
            document.body.classList.remove('no-scroll');
        }

        function finishRegistration() {
            const payUrl = getPaymentUrl();
            if (payUrl) { window.location.href = payUrl; return; }
            showConfirmation();
        }

        function smoothScrollTo(targetId) {
            const target = document.getElementById(targetId);
            if (!target) return;
            const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - 80;
            window.scrollTo({ top: targetPosition, behavior: 'smooth' });
        }

        function validateEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function validateField(input) {
            const formGroup = input.closest('.form-group');
            let isValid = true;
            if (input.required) {
                isValid = input.type === 'email' ? validateEmail(input.value) : input.value.trim() !== '';
            }
            if (formGroup) formGroup.classList.toggle('has-error', !isValid);
            input.classList.toggle('error', !isValid);
            return isValid;
        }

        function getHubSpotCookie() {
            const value = `; ${document.cookie}`;
            const parts = value.split('; hubspotutk=');
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
        }

        function getUtmParams() {
            const urlParams = new URLSearchParams(window.location.search);
            return ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term']
                .map(key => ({ key, value: urlParams.get(key) }))
                .filter(p => p.value)
                .map(p => ({ name: p.key, value: p.value }));
        }

        function showConfirmation() {
            if (formContainer) formContainer.classList.add('hidden');
            if (confirmation) confirmation.classList.add('show');
            if (registerModal) registerModal.scrollTop = 0;
        }

        function showFormError(message) {
            if (!form) return;
            let errorDiv = form.querySelector('.form-error-message');
            if (!errorDiv) {
                errorDiv = document.createElement('div');
                errorDiv.className = 'form-error-message';
                errorDiv.style.cssText = 'color: var(--color-error); text-align: center; margin-top: 16px; font-size: 14px;';
                form.appendChild(errorDiv);
            }
            errorDiv.textContent = message;
        }

        async function handleSubmit(e) {
            e.preventDefault();

            let isFormValid = true;
            form.querySelectorAll('.form-input[required]').forEach(input => {
                if (!validateField(input)) isFormValid = false;
            });
            if (!isFormValid) return;

            if (selectedSessions.length === 0) {
                showFormError('Please choose at least one Lab.');
                return;
            }

            const submitBtn = form.querySelector('.btn-submit');
            const originalBtnText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';

            // Pack the selected Labs into two fields: session_topic (what they
            // chose + total) and session_time (same for every Lab).
            const picked = selectedSessions.map(k => SESSIONS[k]);
            const { count, total, useSeries, upgraded } = getPricing();
            const chosen = picked.map(s => s.topic).join(' | ');
            const sessionSummary = {
                time:  picked[0].time,
                topic: useSeries
                    ? (upgraded
                        ? `Full Series Pass (all 7) [chose ${count}: ${chosen}]  ($${total.toLocaleString()})`
                        : `Full Series Pass (all 7 Labs)  ($${total.toLocaleString()})`)
                    : `${chosen}  (${count} ×, $${total.toLocaleString()})`
            };

            // Demo mode: skip the network call until a real form ID is set.
            if (HUBSPOT_FORM_ID === 'PLACEHOLDER_FORM_ID') {
                setTimeout(finishRegistration, 400);
                return;
            }

            let pageUri;
            try { pageUri = window.top.location.href; } catch (err) { pageUri = window.location.href; }
            const hutk = getHubSpotCookie();

            const formData = {
                fields: [
                    { name: 'firstname', value: document.getElementById('firstName').value.trim() },
                    { name: 'lastname', value: document.getElementById('lastName').value.trim() },
                    { name: 'email', value: document.getElementById('email').value.trim() },
                    { name: 'company', value: document.getElementById('company').value.trim() },
                    { name: 'jobtitle', value: document.getElementById('title').value.trim() },
                    { name: 'session_topic', value: sessionSummary.topic },
                    { name: 'session_time', value: sessionSummary.time },
                    ...getUtmParams()
                ],
                context: {
                    ...(hutk && { hutk }),
                    pageUri,
                    pageName: 'Fierce Leadership Lab Registration'
                },
                skipValidation: true
            };

            try {
                const url = `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_ID}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    finishRegistration();
                } else {
                    const responseText = await response.text();
                    console.error('HubSpot submission error:', response.status, responseText);
                    submitBtn.disabled = false;
                    submitBtn.textContent = originalBtnText;
                    showFormError('Something went wrong. Please try again.');
                }
            } catch (error) {
                console.error('Network error:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = originalBtnText;
                showFormError('Network error. Please check your connection and try again.');
            }
        }

        function init() {
            nav = document.getElementById('nav');
            if (nav) {
                window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 10));
            }

            document.querySelectorAll('a[href^="#"]').forEach(link => {
                link.addEventListener('click', (e) => {
                    const id = link.getAttribute('href').slice(1);
                    if (!id || !document.getElementById(id)) return;
                    e.preventDefault();
                    e.stopPropagation();
                    smoothScrollTo(id);
                });
            });

            registerModal = document.getElementById('registerModal');
            modalClose = document.getElementById('modalClose');

            // Page builders (Divi) wrap content in containers that use CSS
            // transforms / overflow:hidden, which clip a position:fixed modal so
            // it never appears. Relocate the modal to <body> inside a #fierce-lab
            // host so its scoped styles still apply but it covers the viewport.
            if (registerModal && registerModal.parentElement !== document.body) {
                const modalHost = document.createElement('div');
                modalHost.id = 'fierce-lab';
                modalHost.setAttribute('data-fierce-lab-modal-host', '');
                document.body.appendChild(modalHost);
                modalHost.appendChild(registerModal);
            }

            document.querySelectorAll('.js-reserve').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const session = btn.getAttribute('data-session');
                    if (session) selectSession(session);
                    openModal();
                });
            });

            if (modalClose) modalClose.addEventListener('click', closeModal);
            if (registerModal) {
                registerModal.addEventListener('click', (e) => {
                    if (e.target === registerModal) closeModal();
                });
            }
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && registerModal && registerModal.classList.contains('open')) closeModal();
            });

            form = document.getElementById('rsvpForm');
            formContainer = document.getElementById('formContainer');
            confirmation = document.getElementById('confirmation');

            if (form) {
                form.querySelectorAll('.form-input').forEach(input => {
                    input.addEventListener('blur', () => {
                        if (input.value.trim() !== '' || input.required) validateField(input);
                    });
                    input.addEventListener('input', () => {
                        if (input.classList.contains('error')) validateField(input);
                    });
                });
                form.addEventListener('submit', handleSubmit);
            }

            renderSelection();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
</script>
